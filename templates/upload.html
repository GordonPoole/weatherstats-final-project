<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upload CSV</title>

<style>
body{
font-family:Arial,sans-serif;
background:linear-gradient(to right,#4facfe,#00f2fe);
text-align:center;
color:white;
margin:0;
padding:0;
}

.box{
margin-top:140px;
background:white;
color:#333;
display:inline-block;
padding:40px;
border-radius:10px;
width:420px;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

input{
margin:20px 0;
}

button{
padding:12px 24px;
background:#4facfe;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#3399ff;
}
</style>
</head>

<body>

<div class="box">
<h2>Upload Australian Weather CSV</h2>

<p>Select your dataset file to continue.</p>

<form method="POST" enctype="multipart/form-data">
<input type="file" name="file" accept=".csv" required>
<br>
<button type="submit">Upload File</button>
</form>

</div>

</body>
</html>
