<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WeatherStats Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding-top: 40px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
        }

        .topbar {
            margin-top: 25px;
            margin-bottom: 30px;
        }

        .btn {
            border: none;
            padding: 14px 22px;
            margin: 8px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #4facfe;
        }

        .btn:hover {
            background: #eaf5ff;
        }

        select {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            margin-top: 15px;
            width: 260px;
        }

        .panel {
            margin-top: 35px;
            background: rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 25px;
        }

        .chart-box {
            background: white;
            color: #333;
            border-radius: 10px;
            padding: 30px;
            min-height: 420px;
        }

        .chart-box img {
            width: 90%;
            max-width: 850px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
        }

        .summary-box {
            margin-top: 25px;
            background: white;
            color: #333;
            border-radius: 10px;
            padding: 25px;
            text-align: left;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f5f7fa;
            text-align: left;
        }

        td:last-child {
            text-align: right;
            font-weight: bold;
        }

        .logout {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            background: #ff4d4d;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
        }

        .logout:hover {
            background: #e63939;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>WeatherStats Interactive Dashboard</h1>
    <p>Analyze Australian weather observations by city</p>

    <div class="topbar">

        <button class="btn" onclick="showCategory('temp')">
            Temperature Patterns
        </button>

        <button class="btn" onclick="showCategory('rain')">
            Rainfall Distribution
        </button>

        <button class="btn" onclick="showCategory('extreme')">
            Weather Extremes
        </button>

        <br>

        <select id="citySelect">
            <option value="">Select City</option>

            {% for city in cities %}
                <option value="{{ city }}">{{ city }}</option>
            {% endfor %}
        </select>

    </div>

    <div class="panel">

        <div class="chart-box">
            <h2 id="chartTitle">Chart Display Area</h2>

            <p id="chartText">
                Select a city and choose a category to begin analysis.
            </p>

            <img id="liveChart" style="display:none;" src="">
        </div>

        <div class="summary-box">
            <h3>Weather Insights</h3>

            <table>
                <thead>
                    <tr>
                        <th>Metric</th>
                        <th>Value</th>
                    </tr>
                </thead>

                <tbody id="insightTable">
                    <tr><td>City</td><td>Select a city</td></tr>
                    <tr><td>Status</td><td>Waiting</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <a href="/logout" class="logout">Logout</a>

</div>

<script>

let currentCategory = "temp";

document.getElementById("citySelect").addEventListener("change", function () {

    let city = this.value;

    if (city !== "") {
        showCategory(currentCategory);
    }
});

function showCategory(type) {

    currentCategory = type;

    let city = document.getElementById("citySelect").value;

    if (city === "") {
        alert("Please select a city first.");
        return;
    }

    let chart = document.getElementById("liveChart");

    chart.style.display = "block";

    chart.src =
        "/generate_chart/" +
        type +
        "?city=" +
        encodeURIComponent(city) +
        "&t=" +
        new Date().getTime();

    loadInsights(city);

    if (type === "temp") {
        document.getElementById("chartTitle").innerText =
            "Temperature Patterns - " + city;

        document.getElementById("chartText").innerText =
            "Minimum and maximum temperature observations for the selected city.";
    }

    if (type === "rain") {
        document.getElementById("chartTitle").innerText =
            "Rainfall Distribution - " + city;

        document.getElementById("chartText").innerText =
            "Distribution of rainfall measurements for the selected city.";
    }

    if (type === "extreme") {
        document.getElementById("chartTitle").innerText =
            "Weather Extremes - " + city;

        document.getElementById("chartText").innerText =
            "Highest heat, coldest temperature, and wettest recorded observations.";
    }
}

function loadInsights(city) {

    fetch("/city_insights?city=" + encodeURIComponent(city))
    .then(response => response.json())
    .then(data => {

        let html = `
            <tr><td>City</td><td>${city}</td></tr>
            <tr><td>Observations</td><td>${data.observations}</td></tr>
            <tr><td>Avg Min Temp</td><td>${data.avg_min_temp} °C</td></tr>
            <tr><td>Avg Max Temp</td><td>${data.avg_max_temp} °C</td></tr>
            <tr><td>Highest Temp</td><td>${data.max_temp} °C</td></tr>
            <tr><td>Lowest Temp</td><td>${data.min_temp} °C</td></tr>
            <tr><td>Avg Rainfall</td><td>${data.avg_rainfall} mm</td></tr>
            <tr><td>Wettest Day</td><td>${data.max_rainfall} mm</td></tr>
            <tr><td>Avg Humidity</td><td>${data.avg_humidity} %</td></tr>
        `;

        document.getElementById("insightTable").innerHTML = html;
    });
}

</script>

</body>
</html>
