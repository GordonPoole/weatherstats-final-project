<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
font-family: Arial, sans-serif;
background: linear-gradient(to right, #4facfe, #00f2fe);
margin:0;
padding:0;
text-align:center;
color:white;
}

.box{
margin-top:140px;
background:white;
color:#333;
display:inline-block;
padding:40px;
border-radius:10px;
width:320px;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
padding:12px 24px;
background:#4facfe;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#3399ff;
}

.error{
color:red;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="box">
<h2>WeatherStats Login</h2>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

</div>

</body>
</html>
